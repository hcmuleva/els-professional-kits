## Declare variables to be passed into your templates.

global:
  appVersion: ""
  tlsSecretName: ""
  ingressSubdomain: ""


replicaCount: 1
initialDelaySeconds: 10
image:
  repository: pactfoundation/pact-broker
  tag: latest
  port: 9292
  pullPolicy: IfNotPresent


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## Annotations to add to the service account
  annotations: {}
  ## The name of the service account to use.
  ## If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true

service:
  type: ClusterIP
  port: 9292
livenessProbe: {}
readinessProbe: {}
ingress:
  enabled: true
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  host: "pact-broker.local"
  path: /
  namespaceInHost: true
  subdomain: containers.appdomain.cloud
  tlsSecretName: ""
route:
  enabled: false
  insecureEdgeTerminationPolicy: Allow

resources: {}
  ## We usually recommend not to specify default resources and to leave this as a conscious
  ## choice for the user. This also increases chances charts run on environments with little
  ## resources, such as Minikube. If you do want to specify resources, uncomment the following
  ## lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
autoscaling:
  enabled: false
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}

tolerations: []

affinity: {}

vcsInfo:
  ref: ""
  repoUrl: ""
connectsTo: ""

partOf: ""
## The application runtime type.
## Any of the following values will set default resource limits: golang, js, nodejs, java, openjdk, openliberty, python, spring, dotnet, nginx
runtime: ""
## The application component type.
## Expected values are: frontend, backend, database, integration, cache, queue
component: ""

configMap: {}
envFrom: {}
env: {}
## Value for the istio sidecar injection annotation
istio: false
database:
  host: pact-stack-postgres.pact-stack.svc.cluster.local
  name: appdb
  username: postgres
  password: dev123
  useSecret: false
  existingSecret: ""


