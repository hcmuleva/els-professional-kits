apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-ui
  labels: { app.kubernetes.io/name: react-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: react-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: react-ui }
    spec:
      containers:
        - name: react-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /_health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
