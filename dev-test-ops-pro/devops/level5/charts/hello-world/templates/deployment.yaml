apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels: { app.kubernetes.io/name: hello-world }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: hello-world }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hello-world }
    spec:
      containers:
        - name: hello-world
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
