apiVersion: apps/v1
kind: Deployment
metadata:
  name: temple-api
  labels: { app.kubernetes.io/name: temple-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: temple-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: temple-api }
    spec:
      {{- if .Values.waitForPostgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            ['sh','-c','echo "Waiting for Postgres..."; until nc -z {{ .Values.waitForPostgres.host }} {{ .Values.waitForPostgres.port }}; do sleep 2; done; echo "Postgres is up!"']
      {{- end }}
      containers:
        - name: temple-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
          {{- if .Values.secretRef.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef.name }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /admin
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
