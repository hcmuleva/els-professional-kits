apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-suite-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hcmuleva/els-professional-kits.git
    targetRevision: feature/level4
    path: charts/web-suite
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
